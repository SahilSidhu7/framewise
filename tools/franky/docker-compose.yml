# Optional n8n next to the Framewise engine. Host networking so n8n reaches the engine on
# 127.0.0.1:8765; n8n itself listens on 127.0.0.1 only (open it through an SSH tunnel:
#   ssh -L 5678:127.0.0.1:5678 home   then http://127.0.0.1:5678).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - N8N_LISTEN_ADDRESS=127.0.0.1
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Asia/Kolkata
      - AIEDITOR_URL=http://127.0.0.1:8765
      - AIEDITOR_KEY=${AIEDITOR_KEY:-}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/clips/inbox;/clips/out
    volumes:
      - ./data:/home/node/.n8n
      - ../inbox:/clips/inbox
      - ../out:/clips/out
